# Servidor ai-memory exposto na rede (LXC no Proxmox, atrás do Traefik).
# Diferente do docker-compose.yml da raiz (modo local): aqui os hooks rodam
# nativos em cada máquina cliente e falam HTTP com este servidor, então não há
# montagem de repositórios nem porta presa em 127.0.0.1.
#
# Use pelo Makefile (make server-start), que passa o .env.production também
# como --env-file para interpolar VERSION e SERVER_DATA_DIR.
name: ai-memory

services:
  ai-memory:
    image: akitaonrails/ai-memory:${VERSION:-3.2.2}
    container_name: ai-memory
    restart: unless-stopped
    # Usuário da imagem; o diretório de dados precisa pertencer a 1000:1000.
    user: "1000:1000"
    ports:
      - 0.0.0.0:${PORT:-49374}:49374
    volumes:
      - ${SERVER_DATA_DIR:-/var/opt/ai-memory/data}:/data
    env_file:
      - .env.production
    environment:
      - RUST_LOG=ai_memory=info,ai_memory_store=info,ai_memory_wiki=info,ai_memory_mcp=info,tracing_appender=warn
    healthcheck:
      test: ["CMD", "/usr/local/bin/ai-memory", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
